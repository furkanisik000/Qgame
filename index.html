<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qgame Menü</title>
    <style>
        /* Sayfa arka planını ve genel ayarları sıfırlama */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e1e2f, #11111b);
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Ekranın tam ortasındaki menü kutusu */
        .menu-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        /* Oyun Başlığı */
        .menu-title {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #00f2fe;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 242, 254, 0.5);
        }

        /* Alt alta sıralanan buton listesi */
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 15px; /* Butonlar arasındaki boşluk */
        }

        /* Menü Butonları */
        .menu-btn {
            display: block;
            padding: 15px 20px;
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 8px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        /* Butonun üzerine gelindiğinde (Hover efekti) */
        .menu-btn:hover {
            background: linear-gradient(45deg, #0093e9, #80d0c7);
            border-color: #fff;
            box-shadow: 0 0 15px rgba(0, 147, 233, 0.4);
            transform: translateY(-2px); /* Hafif yukarı kalkma efekti */
        }
    </style>
</head>
<body>

    <div class="menu-container">
        <h1 class="menu-title">QGAME</h1>
        
        <div class="menu-list">
            <!-- Oyununuza giden buton -->
            <a href="noen-breach-sector-7.html" class="menu-btn">Neon Sektör 7</a>
            
           
        </div>
    </div>

</body>
</html>
